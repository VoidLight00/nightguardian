name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run NightGuardian master gate
        run: bash gates/verify_nightguardian.sh "$GITHUB_WORKSPACE"
